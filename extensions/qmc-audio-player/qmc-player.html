<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' file:;">
  <title>QQ Music</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", "PingFang SC", sans-serif; overflow: hidden;
    }
    .wrap {
      width: 400px; padding: 36px;
      background: linear-gradient(145deg, #1a1a2e 0%, #0d0d0d 100%);
      border: 1px solid #2e2e4a; border-radius: 16px; text-align: center;
      box-shadow: 0 8px 48px rgba(0,0,0,0.6);
    }
    .disc-wrap { position: relative; width: 140px; height: 140px; margin: 0 auto 24px; }
    .disc {
      width: 140px; height: 140px;
      background: conic-gradient(from 0deg, #1a1a2e, #16213e, #0f3460, #16213e, #1a1a2e);
      border: 3px solid #2e2e4a; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; box-shadow: 0 0 32px rgba(0,120,212,0.15), inset 0 0 20px rgba(0,0,0,0.4);
      transition: transform 0.1s;
    }
    .disc.spin { animation: spin 3s linear infinite; }
    .disc-ring {
      position: absolute; top: 50%; left: 50%;
      width: 160px; height: 160px; margin: -80px 0 0 -80px;
      border: 1px solid rgba(0,120,212,0.2); border-radius: 50%;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title {
      font-size: 15px; font-weight: 600; color: #e8e8e8;
      margin-bottom: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .artist { font-size: 12px; color: #666; margin-bottom: 24px; }
    .prog-wrap { width: 100%; margin-bottom: 6px; cursor: pointer; padding: 4px 0; }
    .prog {
      width: 100%; height: 4px; background: #2a2a3e; border-radius: 2px; overflow: hidden;
    }
    .prog-fill {
      height: 100%; background: linear-gradient(90deg, #0078d4, #00b4d8);
      border-radius: 2px; width: 0; transition: width 100ms linear;
    }
    .times { display: flex; justify-content: space-between; font-size: 10px; color: #555; margin-bottom: 18px; }
    .ctrls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 18px; }
    .ctrls button {
      background: none; border: none; color: #888; font-size: 20px;
      cursor: pointer; padding: 6px; transition: all 150ms;
    }
    .ctrls button:hover { color: #fff; transform: scale(1.1); }
    .play-btn {
      width: 52px; height: 52px; background: linear-gradient(135deg, #0078d4, #00b4d8);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #fff; cursor: pointer; border: none;
      box-shadow: 0 4px 16px rgba(0,120,212,0.4); transition: all 150ms;
    }
    .play-btn:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(0,120,212,0.5); }
    .vol-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .vol-row span { font-size: 13px; color: #555; }
    .vol-row input { width: 110px; accent-color: #0078d4; }
    .badge {
      display: inline-block; margin-top: 16px; padding: 3px 10px;
      background: rgba(0,120,212,0.15); border: 1px solid rgba(0,120,212,0.3);
      border-radius: 10px; font-size: 10px; color: #4a9eff;
    }
    .err { color: #e81123; font-size: 13px; padding: 40px 20px; line-height: 1.8; }
    .err small { color: #555; font-size: 11px; display: block; margin-top: 6px; }
    .loading { color: #666; font-size: 13px; padding: 40px; }
    .loading::after { content: ''; animation: dots 1.5s infinite; }
    @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="loading" id="loading">正在解密 QQ 音乐...</div>
  </div>
  <audio id="a" preload="auto"></audio>
  <script>
    (async function () {
      const urlParams = new URLSearchParams(location.search);
      const filePath = decodeURIComponent(urlParams.get('file') || '');
      if (!filePath) { showErr('未找到文件路径'); return; }

      const name = filePath.split(/\\|\//).pop() || 'unknown';
      document.title = name + ' - QQ Music';

      // ── QMC XOR Decryption ──────────────────────────────────────
      // QMC files use a simple XOR cipher. Different versions use different keys.
      // Key table (common QQ Music XOR keys):
      //   QMC0 (.qmc0)      : key = 0x61
      //   QMCFLAC (.qmcflac): key = 0xA5, or derived from magic bytes
      //   QMCOGG (.qmcogg)  : key = 0x7B
      function xorDecrypt(data, key) {
        const out = new Uint8Array(data.length);
        for (let i = 0; i < data.length; i++) {
          out[i] = data[i] ^ key;
        }
        return out;
      }

      // Detect QMC version and key from magic bytes
      function detectAndDecrypt(buf) {
        const view = new Uint8Array(buf);
        const magic = String.fromCharCode(view[0], view[1], view[2], view[3]);

        // Common QQ Music QMC signatures
        const signatures = {
          'QQxi': { key: 0x61, format: 'flac' },    // QMC v0
          'qmc0': { key: 0x61, format: 'flac' },    // QMC v0 alt
          'QMC ': { key: 0xA5, format: 'flac' },    // QMC FLAC
          '\x51\x51\x78\x69': { key: 0x61, format: 'flac' },
          '\xFF\xFF\xFF\xFF': { key: 0xFF, format: 'unknown' },
        };

        let key = null;
        let format = 'unknown';

        // Try exact magic match first
        if (signatures[magic]) {
          key = signatures[magic].key;
          format = signatures[magic].format;
        }

        // Fallback: detect by extension
        const ext = filePath.split('.').pop()?.toLowerCase() || '';
        if (ext === 'qmc0' || ext === 'qmcflac') {
          key = 0x61; format = 'flac';
        } else if (ext === 'qmcogg') {
          key = 0x7B; format = 'ogg';
        } else if (ext === 'qmc') {
          key = 0x61; format = 'flac';
        }

        // Also try reading the header to find FLAC/OGG signature after partial decrypt
        if (key === null) {
          // Try common keys and look for 'fLaC' or 'OggS'
          const candidates = [0x61, 0xA5, 0x7B, 0xFF, 0x5A, 0x37];
          for (const k of candidates) {
            const test = xorDecrypt(view.slice(0, 20), k);
            const sig = String.fromCharCode(...test);
            if (sig.includes('fLaC') || sig.includes('OggS') || sig.includes('ID3')) {
              key = k; format = sig.includes('fLaC') ? 'flac' : sig.includes('OggS') ? 'ogg' : 'mp3';
              break;
            }
          }
        }

        if (key === null) return null; // Cannot determine key

        // Skip header bytes (usually first 12-16 bytes are metadata)
        const headerSize = (magic === 'QQxi' || magic === 'qmc0') ? 12 : 16;
        const decrypted = xorDecrypt(view.slice(headerSize), key);

        // Prepend FLAC/OGG magic to make it a valid file
        let finalBuf;
        if (format === 'flac') {
          finalBuf = new Uint8Array(4 + decrypted.length);
          finalBuf.set([0x66, 0x4C, 0x61, 0x43], 0); // 'fLaC'
          finalBuf.set(decrypted, 4);
        } else if (format === 'ogg') {
          finalBuf = new Uint8Array(4 + decrypted.length);
          finalBuf.set([0x4F, 0x67, 0x67, 0x53], 0); // 'OggS'
          finalBuf.set(decrypted, 4);
        } else {
          finalBuf = decrypted;
        }

        return { buffer: finalBuf, format, key, headerSize };
      }

      // ── UI Setup ────────────────────────────────────────────────
      function setupPlayer(decrypted) {
        const wrap = document.getElementById('wrap');
        wrap.innerHTML = `
          <div class="disc-wrap">
            <div class="disc-ring"></div>
            <div class="disc" id="disc">🎵</div>
          </div>
          <div class="title" id="ttl">${escHtml(name)}</div>
          <div class="artist">${decrypted.format.toUpperCase()} · XOR Key: 0x${decrypted.key.toString(16).toUpperCase()}</div>
          <div class="prog-wrap" id="progWrap">
            <div class="prog"><div class="prog-fill" id="pf"></div></div>
          </div>
          <div class="times">
            <span id="cur">0:00</span>
            <span id="dur">0:00</span>
          </div>
          <div class="ctrls">
            <button id="prev" title="上一首">⏮</button>
            <button class="play-btn" id="play" title="播放/暂停">▶</button>
            <button id="next" title="下一首">⏭</button>
          </div>
          <div class="vol-row">
            <span>🔈</span>
            <input type="range" id="vol" min="0" max="1" step="0.02" value="0.8">
            <span>🔊</span>
          </div>
          <div class="badge">QQ Music Decoder · QMC ${decrypted.format.toUpperCase()}</div>
        `;

        const a = document.getElementById('a');
        const disc = document.getElementById('disc');
        const playBtn = document.getElementById('play');

        // Create blob URL from decrypted buffer
        const blob = new Blob([decrypted.buffer], { type: getMimeType(decrypted.format) });
        a.src = URL.createObjectURL(blob);
        a.volume = 0.8;

        playBtn.onclick = () => {
          if (a.paused) { a.play().catch(e => showErr('播放失败: ' + e.message)); playBtn.textContent = '⏸'; disc.classList.add('spin'); }
          else          { a.pause(); playBtn.textContent = '▶'; disc.classList.remove('spin'); }
        };
        a.ontimeupdate = () => {
          if (!a.duration) return;
          const p = (a.currentTime / a.duration) * 100;
          document.getElementById('pf').style.width = p + '%';
          document.getElementById('cur').textContent = fmt(a.currentTime);
        };
        a.onloadedmetadata = () => { document.getElementById('dur').textContent = fmt(a.duration); };
        a.onended = () => { playBtn.textContent = '▶'; disc.classList.remove('spin'); };
        a.onerror = () => { showErr('无法播放此音频文件<br><small>解密成功但格式不受支持，可能需要手动转换</small>'); };
        document.getElementById('progWrap').onclick = e => {
          if (!a.duration) return;
          const r = e.currentTarget.getBoundingClientRect();
          a.currentTime = ((e.clientX - r.left) / r.width) * a.duration;
        };
        document.getElementById('vol').oninput = e => { a.volume = parseFloat(e.target.value); };
      }

      function getMimeType(fmt) {
        return { flac: 'audio/flac', ogg: 'audio/ogg', mp3: 'audio/mpeg' }[fmt] || 'audio/octet-stream';
      }

      function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function fmt(s) {
        if (!s || !isFinite(s)) return '0:00';
        return Math.floor(s / 60) + ':' + Math.floor(s % 60).toString().padStart(2, '0');
      }

      function showErr(msg) {
        document.getElementById('wrap').innerHTML =
          '<div class="err">' + msg.replace(/\n/g, '<br>') + '</div>';
      }

      // ── Main ───────────────────────────────────────────────────
      try {
        const result = await window.omniview.readFileBuffer(filePath);
        if (!result.success) throw new Error(result.error || '读取失败');

        const decrypted = detectAndDecrypt(result.buffer);
        if (!decrypted) throw new Error('无法识别 QQ 音乐加密格式，请确认文件完整性');

        setupPlayer(decrypted);
      } catch (e) {
        showErr((e instanceof Error ? e.message : String(e)));
      }
    })();
  </script>
</body>
</html>
