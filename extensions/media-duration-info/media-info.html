<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' file:;">
  <title>Media Info</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1e1e1e; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: "Segoe UI", sans-serif; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 5px 12px; background: #252526; border-bottom: 1px solid #333; height: 32px; flex-shrink: 0; }
    .bar .name { flex: 1; font-size: 11px; color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .info { flex: 1; overflow: auto; padding: 20px; }
    .info-row { display: flex; padding: 8px 0; border-bottom: 1px solid #2a2a2a; }
    .info-key { width: 120px; color: #888; font-size: 11px; flex-shrink: 0; }
    .info-val { color: #d4d4d4; font-size: 11px; }
    .err { display: flex; align-items: center; justify-content: center; height: 100%; color: #e81123; font-size: 12px; }
  </style>
</head>
<body>
  <div class="bar"><span class="name" id="nm"></span></div>
  <div class="info" id="info"></div>
  <div class="err" id="err" style="display:none;"></div>
  <script>
    (function() {
      const fp = decodeURIComponent(new URLSearchParams(location.search).get('file') || '');
      const name = fp.split(/\\|\//).pop() || 'media';
      document.getElementById('nm').textContent = name;
      document.title = name + ' - Media Info';

      async function load() {
        try {
          const statResult = await window.parent.omniview.readFileBuffer(fp);
          if (!statResult.success) throw new Error(statResult.error);
          
          const info = [
            { key: '文件名', val: name },
            { key: '文件大小', val: formatSize(statResult.buffer.byteLength) },
            { key: 'MIME 类型', val: detectType(fp, statResult.buffer) },
          ];
          
          // Try to get media duration
          try {
            const blob = new Blob([statResult.buffer]);
            const url = URL.createObjectURL(blob);
            const media = new Audio(url);
            await new Promise((resolve) => {
              media.onloadedmetadata = resolve;
              media.onerror = resolve;
              media.src = url;
            });
            if (!isNaN(media.duration)) {
              info.push({ key: '时长', val: formatDuration(media.duration) });
            }
            URL.revokeObjectURL(url);
          } catch(e) {}
          
          const container = document.getElementById('info');
          container.innerHTML = info.map(i => 
            `<div class="info-row"><span class="info-key">${i.key}</span><span class="info-val">${i.val}</span></div>`
          ).join('');
        } catch (e) {
          document.getElementById('err').style.display = 'flex';
          document.getElementById('err').textContent = 'Error: ' + e.message;
        }
      }
      
      function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
        if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
        return (bytes/1024/1024/1024).toFixed(2) + ' GB';
      }
      
      function formatDuration(s) {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return m + ':' + sec.toString().padStart(2, '0');
      }
      
      function detectType(ext, buf) {
        const extMap = { mp4: 'video/mp4', mkv: 'video/x-matroska', avi: 'video/x-msvideo', mov: 'video/quicktime',
                         mp3: 'audio/mpeg', wav: 'audio/wav', flac: 'audio/flac', ogg: 'audio/ogg', m4a: 'audio/mp4' };
        const e = ext.split('.').pop()?.toLowerCase() || '';
        return extMap[e] || 'application/octet-stream';
      }
      
      load();
    })();
  </script>
</body>
</html>
