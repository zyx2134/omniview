<!DOCTYPE html>
<html><head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>Image Info</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1e1e1e; height: 100vh; overflow-y: auto; font-family: "Segoe UI", sans-serif; color: #ccc; padding: 16px; }
    .header { display: flex; align-items: center; gap: 12px; padding: 12px; background: #252526; border-radius: 6px; margin-bottom: 16px; }
    .icon { width: 48px; height: 48px; background: #0078d4; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .file-name { font-size: 14px; font-weight: 600; color: #fff; word-break: break-all; }
    .section { margin-bottom: 16px; }
    .section-title { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .prop-table { width: 100%; border-collapse: collapse; }
    .prop-table tr { border-bottom: 1px solid #2e2e2e; }
    .prop-table tr:last-child { border-bottom: none; }
    .prop-table td { padding: 6px 0; font-size: 12px; }
    .prop-table td:first-child { color: #888; width: 40%; }
    .prop-table td:last-child { color: #ccc; }
    .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: #666; font-size: 13px; }
  </style>
</head><body>
  <div class="loading">Loading...</div>
  <script>
    const fp = decodeURIComponent(new URLSearchParams(location.search).get('file') || '');
    const name = fp.split(/\\|\//).pop() || 'unknown';
    const ext = name.split('.').pop().toUpperCase();
    
    // Use img element to detect dimensions
    const img = new Image();
    img.onload = function() {
      const fmt = ext === 'JPG' || ext === 'JPEG' ? 'JPEG' : ext === 'PNG' ? 'PNG' : ext === 'GIF' ? 'GIF' : ext === 'WEBP' ? 'WebP' : ext === 'BMP' ? 'BMP' : 'Unknown';
      document.body.innerHTML = '<div class="header"><div class="icon">\uD83D\uDDB2</div><div><div class="file-name">'+name+'</div><div style="font-size:11px;color:#888">'+fmt+' Image</div></div></div>'+
        '<div class="section"><div class="section-title">Dimensions</div><table class="prop-table">'+
        '<tr><td>Width</td><td>'+img.naturalWidth+' px</td></tr>'+
        '<tr><td>Height</td><td>'+img.naturalHeight+' px</td></tr>'+
        '<tr><td>Total Pixels</td><td>'+((img.naturalWidth*img.naturalHeight).toLocaleString())+'</td></tr>'+
        '<tr><td>Aspect Ratio</td><td>'+getRatio(img.naturalWidth, img.naturalHeight)+'</td></tr>'+
        '</table></div>'+
        '<div class="section"><div class="section-title">General</div><table class="prop-table">'+
        '<tr><td>Name</td><td>'+name+'</td></tr>'+
        '<tr><td>Format</td><td>'+fmt+'</td></tr>'+
        '<tr><td>File Extension</td><td>.'+ext.toLowerCase()+'</td></tr>'+
        '</table></div>';
    };
    img.onerror = function() {
      document.body.innerHTML = '<div style="padding:20px;color:#e81123">Cannot load image</div>';
    };
    img.src = 'file:///' + fp.replace(/\\/g, '/');
    
    function getRatio(w, h) {
      const gcd = (a,b) => b ? gcd(b, a%b) : a;
      const d = gcd(w,h);
      return (w/d)+':'+(h/d);
    }
  </script>
</body></html>
