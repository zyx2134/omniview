<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' file:;">
  <title>XML</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1e1e1e; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: "Consolas", monospace; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 5px 12px; background: #252526; border-bottom: 1px solid #333; height: 32px; flex-shrink: 0; }
    .bar .name { flex: 1; font-size: 11px; color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar .stats { font-size: 10px; color: #666; }
    pre { flex: 1; overflow: auto; padding: 14px; font-size: 12px; line-height: 1.6; }
    .err { display: flex; align-items: center; justify-content: center; height: 100%; color: #e81123; font-size: 12px; }
    .tag { color: #569cd6; }
    .attr-name { color: #9cdcfe; }
    .attr-val { color: #ce9178; }
    .text { color: #d4d4d4; }
    .comment { color: #6a9955; }
    .proc { color: #c586c0; }
  </style>
</head>
<body>
  <div class="bar"><span class="name" id="nm"></span><span class="stats" id="st"></span></div>
  <pre><code id="code"></code></pre>
  <div class="err" id="err" style="display:none;"></div>
  <script>
    const fp = decodeURIComponent(new URLSearchParams(location.search).get('file') || '');
    const name = fp.split(/\\|\//).pop() || 'xml';
    document.getElementById('nm').textContent = name;
    document.title = name + ' - XML';

    function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function syntaxHighlightXml(text) {
      return escapeHtml(text).replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="comment">$1</span>')
        .replace(/(&lt;\/?)([\w:-]+)/g, '$1<span class="tag">$2</span>')
        .replace(/([\w:-]+)(=)(&quot;[^&]*&quot;)/g, '<span class="attr-name">$1</span>$2<span class="attr-val">$3</span>')
        .replace(/(&lt;![\w-]+)/g, '<span class="proc">$1</span>');
    }

    async function load() {
      try {
        const result = await window.omniview.readFile(fp);
        if (!result.success) throw new Error(result.error);
        const raw = result.content;
        try {
          new DOMParser().parseFromString(raw, 'text/xml');
          document.getElementById('st').textContent = 'Valid XML, ' + raw.length + ' chars';
        } catch (e) {
          document.getElementById('st').textContent = 'Parse error';
        }
        document.getElementById('code').innerHTML = syntaxHighlightXml(raw);
      } catch (e) {
        document.getElementById('err').style.display = 'flex';
        document.getElementById('err').textContent = 'Error: ' + e.message;
      }
    }
    load();
  </script>
</body>
</html>
