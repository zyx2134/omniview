<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' file:;">
  <title>SQL</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1e1e1e; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: "Consolas", monospace; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 5px 12px; background: #252526; border-bottom: 1px solid #333; height: 32px; flex-shrink: 0; }
    .bar .name { flex: 1; font-size: 11px; color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar .stats { font-size: 10px; color: #666; }
    pre { flex: 1; overflow: auto; padding: 14px; font-size: 12px; line-height: 1.7; color: #d4d4d4; }
    .err { display: flex; align-items: center; justify-content: center; height: 100%; color: #e81123; font-size: 12px; }
    .kw { color: #569cd6; font-weight: 600; }
    .str { color: #ce9178; }
    .num { color: #b5cea8; }
    .cmt { color: #6a9955; font-style: italic; }
    .op { color: #d4d4d4; }
  </style>
</head>
<body>
  <div class="bar"><span class="name" id="nm"></span><span class="stats" id="st"></span></div>
  <pre id="code"></pre>
  <div class="err" id="err" style="display:none;"></div>
  <script>
    const fp = decodeURIComponent(new URLSearchParams(location.search).get('file') || '');
    const name = fp.split(/\\|\//).pop() || 'sql';
    document.getElementById('nm').textContent = name;
    document.title = name + ' - SQL';

    const SQL_KEYWORDS = /\b(SELECT|FROM|WHERE|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|TABLE|INDEX|VIEW|JOIN|INNER|LEFT|RIGHT|OUTER|ON|AND|OR|NOT|NULL|IS|IN|LIKE|BETWEEN|ORDER|BY|ASC|DESC|GROUP|HAVING|LIMIT|OFFSET|UNION|ALL|DISTINCT|SET|VALUES|INTO|AS|CASE|WHEN|THEN|ELSE|END|IF|EXISTS|PRIMARY|KEY|FOREIGN|REFERENCES|CONSTRAINT|DEFAULT|CHECK|UNIQUE|BIGINT|INTEGER|VARCHAR|TEXT|BOOLEAN|DATE|TIMESTAMP|FLOAT|DOUBLE|DECIMAL|CHAR|SERIAL|AUTO_INCREMENT)\b/gi;

    function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function highlightSQL(text) {
      let result = escapeHtml(text);
      // Comments
      result = result.replace(/(--[^\n]*)/g, '<span class="cmt">$1</span>');
      result = result.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cmt">$1</span>');
      // Strings
      result = result.replace(/('([^'\\]|\\.)*')/g, '<span class="str">$1</span>');
      result = result.replace(/("([^"\\]|\\.)*")/g, '<span class="str">$1</span>');
      // Numbers
      result = result.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
      // Keywords
      result = result.replace(SQL_KEYWORDS, '<span class="kw">$&</span>');
      return result;
    }

    async function load() {
      try {
        const result = await window.parent.omniview.readFile(fp);
        if (!result.success) throw new Error(result.error);
        const raw = result.content;
        document.getElementById('code').innerHTML = highlightSQL(raw);
        document.getElementById('st').textContent = raw.length + ' chars, ' + raw.split('\n').length + ' lines';
      } catch (e) {
        document.getElementById('err').style.display = 'flex';
        document.getElementById('err').textContent = 'Error: ' + e.message;
      }
    }
    load();
  </script>
</body>
</html>
