<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' file:;">
  <title>图片</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        linear-gradient(45deg, #111 25%, transparent 25%),
        linear-gradient(-45deg, #111 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #111 75%),
        linear-gradient(-45deg, transparent 75%, #111 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    }
    #img {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      image-rendering: auto;
    }
    .err { display: flex; align-items: center; justify-content: center; height: 100vh; color: #e81123; font-size: 13px; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <img id="img" alt="">
  <div class="err" id="err" style="display:none;"></div>
  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      const fp = decodeURIComponent(params.get('file') || '');
      const name = fp.split(/\\|\//).pop() || '图片';
      document.title = name + ' - Omniview';
      document.getElementById('img').alt = name;

      const img = document.getElementById('img');
      // file:// on Windows needs three slashes: file:///C:/path
      const src = 'file:///' + fp.replace(/^\/+/, '').replace(/\\/g, '/');
      img.src = src;

      img.onerror = function() {
        document.getElementById('img').style.display = 'none';
        document.getElementById('err').style.display = 'flex';
        document.getElementById('err').innerHTML =
          '<div>无法加载图片</div>' +
          '<div style="font-size:11px;color:#666;margin-top:4px;">' + fp + '</div>';
      };

      // Notify parent of title
      window.parent.postMessage({ type: 'omniview:title', title: name }, window.location.origin);
    })();
  </script>
</body>
</html>
