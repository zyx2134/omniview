<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' file:;">
  <title>音频</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", sans-serif; overflow: hidden;
    }
    .wrap {
      width: 380px; padding: 32px;
      background: #1c1c1c; border: 1px solid #2e2e2e;
      border-radius: 8px; text-align: center;
    }
    .disc {
      width: 120px; height: 120px; margin: 0 auto 20px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 3px solid #2e2e4a; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      transition: transform 0.3s ease;
    }
    .disc.spin { animation: spin 4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .sub  { font-size: 11px; color: #666; margin-bottom: 20px; }
    .prog { width: 100%; height: 3px; background: #2e2e2e; border-radius: 2px; cursor: pointer; margin-bottom: 6px; }
    .prog-fill { height: 100%; background: #0078d4; border-radius: 2px; width: 0; transition: width 80ms; }
    .times { display: flex; justify-content: space-between; font-size: 10px; color: #555; margin-bottom: 16px; }
    .ctrls { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 16px; }
    .ctrls button { background: none; border: none; color: #aaa; font-size: 18px; cursor: pointer; padding: 4px; transition: color 100ms; }
    .ctrls button:hover { color: #fff; }
    .play-btn {
      width: 44px; height: 44px; background: #0078d4; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff; cursor: pointer; border: none; transition: background 100ms;
    }
    .play-btn:hover { background: #106ebe; }
    .vol-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .vol-row span { font-size: 12px; color: #666; }
    .vol-row input { width: 100px; accent-color: #0078d4; }
    .err { color: #e81123; font-size: 13px; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="disc" id="disc">&#9835;</div>
    <div class="title" id="ttl"></div>
    <div class="sub">Omniview Audio</div>
    <div class="prog" id="prog"><div class="prog-fill" id="pf"></div></div>
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="ctrls">
      <button id="prev">&#9198;</button>
      <button class="play-btn" id="play">&#9654;</button>
      <button id="next">&#9197;</button>
    </div>
    <div class="vol-row">
      <span>&#128265;</span>
      <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8">
      <span>&#128266;</span>
    </div>
  </div>
  <audio id="a"></audio>
  <script>
    const fp = decodeURIComponent(new URLSearchParams(location.search).get('file') || '');
    const name = fp.split(/\\|\//).pop() || 'unknown';
    document.getElementById('ttl').textContent = name;
    document.title = name + ' - Omniview';

    const a = document.getElementById('a');
    const disc = document.getElementById('disc');
    const playBtn = document.getElementById('play');
    a.src = 'file:///' + fp.replace(/\\/g, '/');
    a.volume = 0.8;

    playBtn.onclick = () => {
      if (a.paused) { a.play(); playBtn.textContent = String.fromCharCode(9208); disc.classList.add('spin'); }
      else           { a.pause(); playBtn.textContent = String.fromCharCode(9654); disc.classList.remove('spin'); }
    };
    a.ontimeupdate = () => {
      const p = (a.currentTime / (a.duration || 1)) * 100;
      document.getElementById('pf').style.width = p + '%';
      document.getElementById('cur').textContent = fmt(a.currentTime);
    };
    a.onloadedmetadata = () => { document.getElementById('dur').textContent = fmt(a.duration); };
    a.onended = () => { playBtn.textContent = String.fromCharCode(9654); disc.classList.remove('spin'); };
    a.onerror = () => { document.querySelector('.wrap').innerHTML = '<div class="err">Cannot play audio<br><span style="font-size:11px;color:#666">Format may not be supported</span></div>'; };
    document.getElementById('prog').onclick = e => {
      const r = e.currentTarget.getBoundingClientRect();
      a.currentTime = ((e.clientX - r.left) / r.width) * a.duration;
    };
    document.getElementById('vol').oninput = e => { a.volume = parseFloat(e.target.value); };

    function fmt(s) {
      if (!s || !isFinite(s)) return '0:00';
      return Math.floor(s / 60) + ':' + Math.floor(s % 60).toString().padStart(2, '0');
    }
  </script>
</body>
</html>
